<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#fffaf4"/><stop offset="1" stop-color="#f3e5d7"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#cda078"/><stop offset="1" stop-color="#a87551"/></linearGradient>
 <linearGradient id="skin" x2="0" y2="1"><stop stop-color="#f7cbb8"/><stop offset="1" stop-color="#dda18d"/></linearGradient>
 <linearGradient id="hair1" x2="0" y2="1"><stop stop-color="#5b4038"/><stop offset="1" stop-color="#352b2a"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
 <style>
 .float{animation:f 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
 .d2{animation-delay:.35s}.d3{animation-delay:.7s}.d4{animation-delay:1.05s}.d5{animation-delay:1.4s}
 .paper{animation:p 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes p{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-4deg)}}
 </style>
</defs>

<rect width="750" height="1334" fill="url(#wall)"/>
