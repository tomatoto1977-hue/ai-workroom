<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 95 1350 805">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#fffdf9"/><stop offset=".72" stop-color="#f8f1e8"/><stop offset="1" stop-color="#eee2d5"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#c99b73"/><stop offset="1" stop-color="#a97650"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#c89a70"/><stop offset="1" stop-color="#966746"/></linearGradient>
 <linearGradient id="skin" x2="0" y2="1"><stop stop-color="#f4c9b4"/><stop offset="1" stop-color="#dfaa96"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#e5f3f0"/><stop offset="1" stop-color="#bddbd8"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
 <style>
 .float{animation:float 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
 .d2{animation-delay:.3s}.d3{animation-delay:.6s}.d4{animation-delay:.9s}.d5{animation-delay:1.2s}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 .blink{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
 @keyframes blink{0%,91%,100%{transform:scaleY(1)}93%{transform:scaleY(.12)}}
 .paper{animation:paper 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes paper{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-3deg)}}
 </style>
</defs>
<!-- bright room -->
<rect width="1350" height="900" fill="url(#wall)"/>
<!-- subtle ceiling lights -->
<g fill="#fff" opacity=".75"><ellipse cx="250" cy="95" rx="90" ry="18"/><ellipse cx="675" cy="95" rx="110" ry="18"/><ellipse cx="1100" cy="95" rx="90" ry="18"/></g>
<!-- large window -->
<rect x="360" y="105" width="630" height="360" rx="28" fill="#fff" stroke="#a97855" stroke-width="12"/>
<rect x="387" y="132" width="576" height="306" rx="16" fill="url(#glass)"/>
<path d="M675 132V438M387 285H963" stroke="#b68d70" stroke-width="9"/>
<circle cx="835" cy="205" r="47" fill="#ffe89b"/>
<g fill="#86aa79"><path d="M410 424Q475 315 545 424Q610 330 675 424Q745 305 815 424Q880 325 945 424Z"/></g>
<!-- left built-in cabinet -->
<g transform="translate(30 150)">
 <rect width="235" height="385" rx="20" fill="url(#desk)" stroke="#7e563e" stroke-width="5"/>
 <rect x="25" y="30" width="82" height="58" rx="8" fill="#e3b9aa"/><rect x="122" y="30" width="85" height="58" rx="8" fill="#b7cfad"/>
 <path d="M28 125H207M28 215H207M28 305H207" stroke="#ead1b4" stroke-width="13" stroke-linecap="round"/>
 <circle cx="184" cy="350" r="25" fill="#f3d98e"/>
</g>
<!-- right cabinet + plant -->
<g transform="translate(1090 150)">
 <rect y="45" width="225" height="385" rx="22" fill="url(#desk)" stroke="#7e563e" stroke-width="5"/>
 <path d="M28 140H197M28 235H197M28 330H197" stroke="#ead1b4" stroke-width="13" stroke-linecap="round"/>
 <rect x="75" y="88" width="78" height="48" rx="8" fill="#d9b0a0"/>
 <path d="M112 82V20M112 62Q72 30 48 12M112 52Q145 20 178 7M112 76Q82 58 53 62" fill="none" stroke="#6e9968" stroke-width="10" stroke-linecap="round"/>
 <ellipse cx="45" cy="11" rx="27" ry="14" fill="#8db47e"/><ellipse cx="180" cy="7" rx="29" ry="15" fill="#8db47e"/><ellipse cx="53" cy="62" rx="25" ry="13" fill="#82aa77"/>
 <path d="M75 72H149L139 137H85Z" fill="#b67f5b"/>
</g>
<!-- warm floor -->
<rect y="610" width="1350" height="290" fill="url(#floor)"/>
<path d="M0 610H1350" stroke="#8c6047" stroke-width="7"/>
<path d="M0 770H1350M0 850H1350" stroke="#95694d" stroke-width="3" opacity=".35"/>
<!-- floor shadow -->
<ellipse cx="680" cy="775" rx="600" ry="80" fill="#4d382d" opacity=".18" filter="url(#shadow)"/>

<!-- desks -->
<g fill="url(#desk)" stroke="#704d39" stroke-width="6">
 <rect x="105" y="690" width="205" height="112" rx="22"/><rect x="355" y="690" width="205" height="112" rx="22"/>
 <rect x="605" y="690" width="205" height="112" rx="22"/><rect x="855" y="690" width="205" height="112" rx="22"/><rect x="1105" y="690" width="205" height="112" rx="22"/>
</g>
<!-- monitors -->
<g fill="#d9ece9" stroke="#686f6c" stroke-width="7">
 <rect x="150" y="625" width="120" height="76" rx="11"/><rect x="400" y="625" width="120" height="76" rx="11"/>
 <rect x="650" y="625" width="120" height="76" rx="11"/><rect x="900" y="625" width="120" height="76" rx="11"/><rect x="1150" y="625" width="120" height="76" rx="11"/>
</g>
<g fill="#8aa29c" opacity=".8"><rect x="170" y="645" width="80" height="6" rx="3"/><rect x="420" y="645" width="80" height="6" rx="3"/><rect x="670" y="645" width="80" height="6" rx="3"/><rect x="920" y="645" width="80" height="6" rx="3"/><rect x="1170" y="645" width="80" height="6" rx="3"/></g>

