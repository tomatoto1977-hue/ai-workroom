 <path d="M1168 610Q1170 512 1210 508Q1260 512 1260 610Q1238 585 1208 586Q1180 586 1168 610Z" fill="#75553f" stroke="#604634" stroke-width="5"/>
 <path d="M1182 560Q1208 545 1236 560" fill="none" stroke="#503b30" stroke-width="6" stroke-linecap="round"/>
 <g class="blink"><circle cx="1194" cy="579" r="4"/><circle cx="1226" cy="579" r="4"/></g><path d="M1201 596Q1210 603 1219 596" fill="none" stroke="#aa7650" stroke-width="4"/>
</g>

<!-- visible handoff animation -->
<g class="paper" fill="#fffdf7" stroke="#c59469" stroke-width="5"><rect x="300" y="560" width="55" height="42" rx="5" transform="rotate(8 327 581)"/><rect x="550" y="550" width="55" height="42" rx="5" transform="rotate(-7 577 571)"/><rect x="800" y="560" width="55" height="42" rx="5" transform="rotate(8 827 581)"/><rect x="1050" y="550" width="55" height="42" rx="5" transform="rotate(-7 1077 571)"/></g>
<g fill="none" stroke="#d39c68" stroke-width="5" stroke-dasharray="10 12" opacity=".85"><path d="M275 585Q330 535 385 585"/><path d="M525 585Q580 535 635 585"/><path d="M775 585Q830 535 885 585"/><path d="M1025 585Q1080 535 1135 585"/></g>
</svg>