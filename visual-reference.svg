 <g class="blink"><circle cx="694" cy="579" r="4"/><circle cx="726" cy="579" r="4"/></g><path d="M701 596Q710 603 719 596" fill="none" stroke="#a46d48" stroke-width="4"/>
</g>
<!-- agent 4 -->
<g class="float d4">
 <ellipse cx="958" cy="600" rx="78" ry="22" fill="#6c4b39" opacity=".25"/>
 <path d="M900 615Q958 555 1016 615L1005 705H911Z" fill="#a8c9aa" stroke="#714c3d" stroke-width="5"/>
 <rect x="923" y="612" width="70" height="82" rx="34" fill="url(#skin)" stroke="#714c3d" stroke-width="5"/>
 <path d="M918 610Q918 512 960 508Q1010 512 1010 610Q987 585 958 586Q930 586 918 610Z" fill="#49443a" stroke="#3b3832" stroke-width="5"/>
 <path d="M932 560Q958 545 986 560" fill="none" stroke="#34322d" stroke-width="6" stroke-linecap="round"/>
 <g class="blink"><circle cx="944" cy="579" r="4"/><circle cx="976" cy="579" r="4"/></g><path d="M951 596Q960 603 969 596" fill="none" stroke="#708e71" stroke-width="4"/>
</g>
<!-- agent 5 -->
<g class="float d5">
 <ellipse cx="1208" cy="600" rx="78" ry="22" fill="#6c4b39" opacity=".25"/>
 <path d="M1150 615Q1208 555 1266 615L1255 705H1161Z" fill="#efc58d" stroke="#714c3d" stroke-width="5"/>
