 <path d="M184 566Q210 548 238 566" fill="none" stroke="#392d29" stroke-width="6" stroke-linecap="round"/>
 <g class="blink"><circle cx="194" cy="579" r="4"/><circle cx="226" cy="579" r="4"/></g><path d="M201 596Q210 603 219 596" fill="none" stroke="#a45f55" stroke-width="4"/>
 <path d="M183 670H239" stroke="#c97d72" stroke-width="5"/>
</g>
