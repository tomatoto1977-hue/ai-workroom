 <ellipse cx="458" cy="600" rx="78" ry="22" fill="#6c4b39" opacity=".25"/>
 <path d="M400 615Q458 555 516 615L505 705H411Z" fill="#d58faa" stroke="#714c3d" stroke-width="5"/>
 <rect x="423" y="612" width="70" height="82" rx="34" fill="url(#skin)" stroke="#714c3d" stroke-width="5"/>
 <path d="M418 610Q418 512 460 508Q512 514 510 610Q487 585 458 586Q430 586 418 610Z" fill="#393436" stroke="#332d2e" stroke-width="5"/>
 <path d="M432 560Q458 545 486 560" fill="none" stroke="#2c2829" stroke-width="6" stroke-linecap="round"/>
 <g class="blink"><circle cx="444" cy="579" r="4"/><circle cx="476" cy="579" r="4"/></g><path d="M451 596Q460 603 469 596" fill="none" stroke="#a45f72" stroke-width="4"/>
</g>
<!-- agent 3 -->
<g class="float d3">
 <ellipse cx="708" cy="600" rx="78" ry="22" fill="#6c4b39" opacity=".25"/>
 <path d="M650 615Q708 555 766 615L755 705H661Z" fill="#e1b45f" stroke="#714c3d" stroke-width="5"/>
