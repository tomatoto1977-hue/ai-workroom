<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 900">
<defs>
 <linearGradient id="w" y2="1"><stop stop-color="#fffaf4"/><stop offset="1" stop-color="#f2e3d6"/></linearGradient>
 <linearGradient id="d" y2="1"><stop stop-color="#c99b76"/><stop offset="1" stop-color="#a87450"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".14"/></filter>
 <style>
  .person{transform-box:fill-box;transform-origin:center bottom;animation:breathe 3.2s ease-in-out infinite}
  .p2{animation-delay:.25s}.p3{animation-delay:.5s}.p4{animation-delay:.75s}.p5{animation-delay:1s}
  .head{transform-box:fill-box;transform-origin:center bottom}
  .blink{animation:blink 5s infinite}
  .typing{transform-box:fill-box;transform-origin:top center;animation:type 1.1s ease-in-out infinite}
  .typing2{animation-delay:.18s}.typing3{animation-delay:.36s}.typing4{animation-delay:.54s}.typing5{animation-delay:.72s}
  .docpath{animation:pathPulse 1.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes blink{0%,46%,49%,100%{transform:scaleY(1)}47%,48%{transform:scaleY(.12)}}
  @keyframes type{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-4deg)}}
  @keyframes pathPulse{0%,100%{opacity:.45}50%{opacity:1}}
 </style>
</defs>
