<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 900">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#fffdf9"/><stop offset=".68" stop-color="#f8eee4"/><stop offset="1" stop-color="#ead9ca"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#cda27e"/><stop offset="1" stop-color="#a97753"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#d4aa83"/><stop offset="1" stop-color="#aa7855"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#dff3ef"/><stop offset="1" stop-color="#b9d9d4"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#624b3b" flood-opacity=".18"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
 <style>
  .person{transform-box:fill-box;transform-origin:center bottom;animation:breathe 3.4s ease-in-out infinite}
  .p2{animation-delay:.35s}.p3{animation-delay:.7s}.p4{animation-delay:1.05s}.p5{animation-delay:1.4s}
  .blink{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
  .typing{animation:type 1.15s ease-in-out infinite;transform-box:fill-box;transform-origin:center top}
  .t2{animation-delay:.15s}.t3{animation-delay:.3s}.t4{animation-delay:.45s}.t5{animation-delay:.6s}
  .plant{animation:sway 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
  .pplant2{animation-delay:1s}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}
  @keyframes type{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-5deg)}}
  @keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
 </style>
</defs>
