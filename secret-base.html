<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6ee"><title>秘密基地｜AIエージェント作業室</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#51443d;background:linear-gradient(135deg,#f7eadf,#eaf1ea);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button{font:inherit}.app{max-width:1180px;margin:auto;padding:14px 14px 120px}.top{background:rgba(255,252,248,.9);border:1px solid #e2cbb9;border-radius:24px;padding:16px 18px;box-shadow:0 10px 30px #8c705020;backdrop-filter:blur(10px)}h1{margin:0;font-size:22px}.sub{color:#806f66;font-size:12px;margin-top:4px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{padding:7px 11px;border-radius:99px;background:#fff;border:1px solid #ead8ca;font-size:11px}.pill.on{background:#8c6d5b;color:#fff;border-color:#8c6d5b}.flow{display:flex;gap:5px;overflow:auto;margin:12px 0;padding-bottom:3px}.step{min-width:92px;text-align:center;padding:7px;border-radius:12px;background:#fff8f2;border:1px solid #e6d4c6;font-size:10px}.step.active{background:#dceadf;border-color:#a9c5ae;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{position:relative;background:rgba(255,252,248,.96);border:2px solid #ead8ca;border-radius:20px;padding:10px;min-height:128px;cursor:pointer;transition:.2s;box-shadow:0 7px 20px #765b4515}.card:hover,.card.active{transform:translateY(-3px);border-color:#c79f80}.head{display:flex;gap:9px;align-items:center}.avatar{width:48px;height:48px;border-radius:16px;background:var(--c,#d8c0a9);position:relative;flex:none;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 8px #60453320}.avatar:before{content:"";position:absolute;width:23px;height:23px;border-radius:50%;left:11px;top:9px;background:#f5cbb8;border:1px solid #8e695b}.avatar:after{content:"";position:absolute;width:31px;height:17px;border-radius:50% 50% 40% 40%;left:7px;top:3px;background:#6e554c}.n{font-weight:900;font-size:13px}.role{font-size:10px;color:#8a756b;margin-top:2px}.task{font-size:10px;margin:8px 0;color:#68574f;min-height:27px}.meter{height:6px;background:#eee1d7;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#9b7a66;border-radius:8px;transition:width .5s}.foot{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:#927b6e}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#d4a060;margin-right:4px}.card.done .dot{background:#83ad8c}.badge{position:absolute;right:9px;top:9px;font-size:8px;padding:3px 6px;border-radius:99px;background:#f3e7dd}.command{margin-top:12px;display:flex;gap:7px;background:#fff;padding:8px;border:2px solid #d5b49a;border-radius:18px}.command input{flex:1;border:0;outline:0;background:#fff8f3;border-radius:14px;padding:10px;font-size:12px}.command button,.primary{border:0;border-radius:14px;background:#8b6a57;color:#fff;padding:9px 15px;font-weight:800;cursor:pointer}.bottom{display:grid;grid-template-columns:1.4fr .8fr;gap:10px;margin-top:10px}.box{background:rgba(255,252,248,.94);border:1px solid #e2cbb9;border-radius:18px;padding:11px}.box h3{font-size:12px;margin:0 0 7px}.log{font-size:10px;line-height:1.6;max-height:110px;overflow:auto}.gate{text-align:center}.score{font-size:27px;font-weight:900;color:#9b754f}.safe{font-size:9px;color:#78675e}.modal{position:fixed;inset:0;background:#4b3b3370;display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:20}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fffaf6;border-radius:25px 25px 14px 14px;padding:16px;box-shadow:0 -10px 40px #0003}.sheettop{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eadfd7;border-radius:50%;width:34px;height:34px}.patterns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.pat{border:1px solid #e1cfc0;background:#fff;border-radius:12px;padding:8px 4px;font-size:9px;cursor:pointer}.pat:hover{background:#f2e8df}.preview{margin-top:10px;padding:10px;background:#f2e9e2;border-radius:14px;font-size:11px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#51443d;color:#fff;padding:10px 15px;border-radius:99px;font-size:11px;display:none;z-index:30}.toast.show{display:block}@media(max-width:700px){.app{padding:8px 8px 125px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.card{min-height:132px;padding:8px;border-radius:17px}.avatar{width:42px;height:42px}.avatar:before{left:9px;top:8px}.avatar:after{left:5px;top:2px}.n{font-size:11px}.role{font-size:8px}.task{font-size:9px}.patterns{grid-template-columns:repeat(3,1fr)}.bottom{grid-template-columns:1fr}.flow{margin-top:9px}.command{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:50;width:auto;margin:0;box-shadow:0 8px 25px #60453330}.command input{font-size:13px}.command button{padding:9px 12px}}
</style></head><body>
<div class="app"><header class="top"><h1>🏡 秘密基地｜AIエージェント作業室</h1><div class="sub">12人の担当AIが、調査 → 企画 → 制作 → 確認 → 保存まで工程別に動く作業室</div><div class="bar"><span class="pill on">● 稼働中</span><span class="pill">人間承認：必須</span><span class="pill">外部投稿：OFF</span><span class="pill">金銭操作：OFF</span><span class="pill">自動戦略変更：OFF</span></div></header>
<div class="flow" id="flow"></div><section class="grid" id="grid"></section>
<form class="command" onsubmit="run();return false"><input id="cmd" placeholder="統括AIへの指示　例：電気代を節約する記事を企画して"><button>実行</button></form>
<div class="bottom"><div class="box"><h3>📋 作業ログ</h3><div class="log" id="log"></div></div><div class="box gate"><h3>🛡 品質ゲート</h3><div class="score" id="score">0</div><div>点</div><div class="safe">95点以上で次工程へ。公開・外部操作は人間承認。</div></div></div>
<div class="box artifact" id="artifactBox" style="margin-top:10px;display:none"><h3>📦 今回の成果物</h3><div id="artifactStatus" class="safe">AI成果物を受け取りました。</div><textarea id="artifact" style="width:100%;min-height:240px;margin-top:8px;padding:12px;border:1px solid #e2cbb9;border-radius:14px;background:#fffdfb;color:#51443d;font:13px/1.7 -apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;resize:vertical"></textarea><div style="display:flex;gap:7px;margin-top:8px"><button class="primary" type="button" onclick="copyArtifact()">成果物をコピー</button><button class="primary" type="button" onclick="downloadArtifact()">Markdown保存</button></div></div></div>
<div class="modal" id="modal"><div class="sheet"><div class="sheettop"><div><b id="mtitle">エージェント</b><div class="sub" id="mrole"></div></div><button class="close" onclick="closeModal()">×</button></div><div class="preview" id="preview">動作を選択してください。</div><div class="patterns" id="patterns"></div></div></div><div class="toast" id="toast"></div>
<script>
const API_URL='https://ai-workroom-api.onrender.com';
const STATE_VERSION='20261002-final2';
const A=[['さとる','統括','全工程の管理・最終判断','#b8c8b2'],['まいか','企画','企画・テーマ設計','#e8b9b5'],['りょう','市場調査','市場・競合の調査','#b7c8df'],['たくや','企画修正','企画の改善・修正','#d8c39f'],['はると','情報収集','情報・資料の収集','#b9d5c1'],['りの','予算','予算・条件の設計','#d8b9ce'],['れん','文章化','執筆・ライティング','#e7c19e'],['あかり','エビデンス','チェック・校正・根拠確認','#f0c6aa'],['かい','動画','動画・画像制作','#b9cbe4'],['なな','編集','編集・投稿準備','#c8b7d9'],['ゆい','実装','実装・SNS拡散準備','#c3d3a7'],['しおり','保存・整理','保存・整理・記録','#d7c1b2']];
const P=['デスクに座っている','書類を届ける','長考している','バリバリ仕事','悲しんでいる','喜んでいる','恋してる','お腹空いた','サボってる','疲れている','驚いている','怒っている','困っている','照れている','電話','スマホ','メモ','達成','作業・保存','満足'];
const stages=['統括','企画','市場調査','企画修正','情報収集','予算','文章化','エビデンス','動画','編集','実装','保存・整理'];
let progress=A.map(()=>0),active=0,paused=false,timer=null;
const grid=document.getElementById('grid'),flow=document.getElementById('flow');
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
flow.innerHTML=stages.map((s,i)=>'<div class="step '+(i===0?'active':'')+'" id="s'+i+'">'+s+'</div>').join('');
grid.innerHTML=A.map((a,i)=>'<article class="card" id="c'+i+'" onclick="openAgent('+i+')"><span class="badge" id="b'+i+'">待機</span><div class="head"><div class="avatar" style="--c:'+a[3]+'"></div><div><div class="n">'+a[0]+'</div><div class="role">'+a[1]+'</div></div></div><div class="task" id="t'+i+'">'+a[2]+'</div><div class="meter"><i id="m'+i+'"></i></div><div class="foot"><span><i class="dot"></i><span id="st'+i+'">待機</span></span><span id="p'+i+'">0%</span></div></article>').join('');
function log(s){const e=document.getElementById('log');e.innerHTML='<div>'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'　'+esc(s)+'</div>'+e.innerHTML}
function render(){A.forEach((a,i)=>{document.getElementById('m'+i).style.width=progress[i]+'%';document.getElementById('p'+i).textContent=progress[i]+'%';let status=progress[i]>=100?'完了':progress[i]>0?'作業中':'待機';document.getElementById('st'+i).textContent=status;document.getElementById('b'+i).textContent=status;document.getElementById('c'+i).classList.toggle('done',progress[i]>=100)});document.getElementById('score').textContent=Math.round(progress.reduce((a,b)=>a+b,0)/A.length);save()}
function save(){localStorage.setItem('secret-base-state',JSON.stringify({version:STATE_VERSION,progress,active}))}
function openAgent(i){active=i;document.getElementById('mtitle').textContent=A[i][0]+'｜'+A[i][1];document.getElementById('mrole').textContent=A[i][2];document.getElementById('patterns').innerHTML=P.map((p,j)=>'<button class="pat" onclick="doPattern('+i+','+j+')">'+(j+1)+'. '+p+'</button>').join('');document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function doPattern(i,j){document.getElementById('preview').textContent=A[i][0]+' が「'+P[j]+'」の動作をしています。';progress[i]=Math.min(100,progress[i]+5);document.getElementById('t'+i).textContent=P[j]+'｜'+A[i][2];log(A[i][0]+'：'+P[j]);render();toast(A[i][0]+' の動作を反映しました')}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function showArtifact(text,status){if(!text)return;document.getElementById('artifactBox').style.display='block';document.getElementById('artifactStatus').textContent=status||'成果物を受け取りました。';document.getElementById('artifact').value=text;localStorage.setItem('secret-base-artifact',text);setTimeout(()=>document.getElementById('artifactBox').scrollIntoView({behavior:'smooth',block:'start'}),50)}
async function copyArtifact(){const v=document.getElementById('artifact').value;if(!v)return;try{await navigator.clipboard.writeText(v);toast('成果物をコピーしました')}catch(e){document.getElementById('artifact').select();toast('選択しました。コピーしてください')}}
function downloadArtifact(){const v=document.getElementById('artifact').value;if(!v)return;const blob=new Blob([v],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='secret-base-result.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Markdownを保存しました')}
function tick(){if(paused)return;const i=active;if(progress[i]<100){progress[i]=Math.min(100,progress[i]+Math.floor(Math.random()*4)+2)}else if(i<A.length-1){active=i+1;progress[active]=2}document.querySelectorAll('.step').forEach(x=>x.classList.remove('active'));document.getElementById('s'+active).classList.add('active');render()}
async function run(){const x=document.getElementById('cmd'),instruction=x.value.trim();if(!instruction)return;const btn=document.querySelector('.command button');if(btn){btn.disabled=true;btn.textContent='処理中…'}document.getElementById('artifactBox').style.display='none';localStorage.removeItem('secret-base-artifact');log('統括AI：'+instruction+' を受領。工程順に開始');active=0;progress=A.map(()=>0);progress[0]=2;document.querySelectorAll('.step').forEach(x=>x.classList.remove('active'));document.getElementById('s0').classList.add('active');render();x.value='';toast('工程順に作業を開始しました');if(timer)clearInterval(timer);timer=setInterval(tick,900);try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);const r=await fetch(API_URL+'/api/orchestrate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction,project:'秘密基地 AIエージェント作業室',max_output_tokens:900}),signal:controller.signal});clearTimeout(timeout);if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(data.workflow)data.workflow.forEach(w=>log(w.stage+'：'+(w.roles||[]).join('・')));const map={'統括AI':0,'企画AI':1,'市場調査AI':2,'情報収集AI':4,'予算AI':5,'文章化AI':6,'エビデンスAI':7,'動画制作AI':8,'編集AI':9,'実装AI':10,'保存・整理AI':11,'チェックAI':7};(data.results||[]).forEach(item=>{const i=map[item.role];if(i!==undefined){progress[i]=item.status==='completed'?100:Math.max(progress[i],30);document.getElementById('t'+i).textContent=(item.text||A[i][2]).replace(/\s+/g,' ').slice(0,90)}log(item.role+'：'+(item.status==='completed'?'成果を受領':'処理状態 '+item.status))});if(data.gate){document.getElementById('score').textContent=(data.gate.score??0);log(data.gate.passed?'品質ゲート：合格':'品質ゲート：改善・再点検が必要')}const completed=data.results||[],finalItem=[...completed].reverse().find(x=>x.role==='統括AI'&&x.status==='completed')||[...completed].reverse().find(x=>x.status==='completed');if(finalItem){const artifact='【秘密基地・成果物】\n指示：'+instruction+'\n\n【統括成果】\n'+finalItem.text+'\n\n【担当AIの成果】\n'+completed.filter(x=>x.status==='completed'&&x.role!=='統括AI').map(x=>'■ '+x.role+'\n'+x.text).join('\n\n');showArtifact(artifact,data.mode==='openai'?'実AIで作成した成果物です。':'現在はシミュレーション成果物です。OPENAI_API_KEY接続後に実AI成果物になります。')}render();toast(data.mode==='openai'?'成果物を作成しました':'シミュレーション成果物を作成しました')}catch(e){log('AI API：'+(e.name==='AbortError'?'応答待ち時間を超過':'接続エラー'));toast('API接続に問題があります')}finally{if(btn){btn.disabled=false;btn.textContent='実行'}}}
const old=JSON.parse(localStorage.getItem('secret-base-state')||'null');if(old&&old.version===STATE_VERSION){progress=Array.isArray(old.progress)?old.progress:progress;active=Number.isInteger(old.active)?old.active:0}else{localStorage.removeItem('secret-base-state');progress=A.map(()=>0);active=0}const savedArtifact=localStorage.getItem('secret-base-artifact');if(savedArtifact){document.getElementById('artifactBox').style.display='block';document.getElementById('artifact').value=savedArtifact;document.getElementById('artifactStatus').textContent='前回の成果物を表示しています。'}render();log('秘密基地：12人のエージェントを待機・順番に稼働できる状態にしました');fetch(API_URL+'/health',{cache:'no-store'}).then(r=>r.json()).then(d=>log(d.ok?(d.openai_configured?'AI API：実AI接続済み':'AI API：サーバー接続済み'):'AI API：応答確認中')).catch(()=>log('AI API：接続確認中'));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
</script></body></html>
