<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>AI作業室</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f3e7da;color:#4c4039;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{min-height:100vh}.shell{min-height:100vh;display:flex;justify-content:center;padding:10px}
.artboard{position:relative;width:min(1350px,100vw);aspect-ratio:3/2;overflow:hidden;border-radius:18px;box-shadow:0 10px 32px rgba(83,53,33,.18);background:#fff}
.reference{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}.panel,.control,.status{opacity:0;pointer-events:none}
button,input{font:inherit}.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:12px}
.new{left:61%;top:3%;width:9%;height:6.5%}.pause{left:70%;top:3%;width:8%;height:6.5%}.settings{left:78.5%;top:3%;width:9%;height:6.5%}
.panel{position:absolute;background:rgba(255,255,255,.95);border:2px solid rgba(205,169,139,.8);box-shadow:0 5px 16px rgba(80,55,40,.12);border-radius:16px;backdrop-filter:blur(3px)}
.project{left:29%;top:10.8%;width:40%;padding:9px 14px}.project strong{font-size:14px}.project span{float:right;font-size:12px;color:#7b6a60}
.agents{position:absolute;left:5%;right:16.5%;top:39%;display:grid;grid-template-columns:repeat(5,1fr);gap:1.4%}
.agent{min-width:0;padding:7px 9px}.agent b{font-size:12px}.agent small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 5px;color:#75645b}.bar{height:6px;background:#eadfd5;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .35s}.score{float:right;font-size:11px;font-weight:800}
.manager{left:5.5%;bottom:6.5%;width:24%;padding:8px 11px}.manager b{font-size:13px}.manager small{display:block;color:#78675e;margin-top:2px}.manager .quality{float:right;font-weight:900;color:#d28d35}
.log{position:absolute;right:1.8%;top:12.8%;width:11.4%;height:52%;padding:7px;overflow:hidden}.log h3{font-size:13px;margin:0 0 5px}.log div{font-size:9px;line-height:1.45;padding:3px 0;border-bottom:1px dashed #e7d8cb}.gate{position:absolute;right:1.8%;bottom:20.5%;width:11.4%;padding:7px;text-align:center}.gate b{font-size:11px}.gate strong{display:block;font-size:20px;color:#d18d39}.toast{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:none;z-index:5;min-width:220px;max-width:70%;padding:12px 15px;background:#fff;border:2px solid #d4b196;border-radius:16px;box-shadow:0 12px 35px rgba(0,0,0,.16);text-align:center;font-size:13px}
.control{position:absolute;left:32%;bottom:1.7%;width:36%;display:flex;gap:6px}.control input{flex:1;border:1px solid #d9c6b7;border-radius:18px;padding:7px 10px;background:rgba(255,255,255,.95);outline:none;font-size:11px}.control button{border:0;border-radius:18px;padding:7px 12px;background:#8b6a57;color:white;font-weight:800;font-size:11px}
.status{position:absolute;left:1.7%;bottom:1.7%;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.95);font-size:10px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.1)}
@media(max-width:700px){.shell{padding:0}.artboard{width:100vw;height:66.6667vw;aspect-ratio:3/2;border-radius:0;box-shadow:none}.project{font-size:8px;padding:4px 6px}.project strong{font-size:8px}.project span{font-size:7px}.agents{top:39.5%;left:5%;right:17%}.agent{padding:3px 4px;border-radius:8px}.agent b{font-size:6.5px}.agent small{font-size:5.5px;margin:1px 0 2px}.bar{height:3px}.score{font-size:5.5px}.manager{font-size:6px;padding:4px 6px}.manager b{font-size:7px}.manager small{font-size:5px}.log{padding:3px}.log h3{font-size:7px;margin:0}.log div{font-size:4.5px}.gate{padding:3px}.gate b{font-size:5.5px}.gate strong{font-size:10px}.control{left:31%;width:37%;bottom:1.2%}.control input{font-size:6px;padding:4px 6px}.control button{font-size:6px;padding:4px 7px}.status{font-size:5.5px;padding:3px 5px}}
</style>
</head>
<body>
<div class="shell"><main class="artboard" id="board">
<img class="reference" src="./reference-target.jpg" alt="AI作業室">
<div class="panel project"><strong>現在のプロジェクト：節約・家計ショート動画</strong><span id="overall">全体 0%</span></div>
<div class="agents" id="agents"></div>
<div class="panel manager"><b>統括AI</b><span class="quality" id="quality">品質 70点</span><small id="managerTask">市場調査と競争戦略を確認中</small></div>
<div class="panel log"><h3>作業ログ</h3><div id="log"></div></div>
<div class="panel gate"><b>品質ゲート</b><strong id="gateScore">70点</strong></div>
<div class="control"><input id="instruction" placeholder="統括AIへの指示（例：節約動画を作る）"><button onclick="send()">送信</button></div>
<div class="status" id="status">● LIVE　統括AIが全工程を管理</div>
<div class="toast" id="toast"></div>
<button class="hot new" aria-label="新規プロジェクト" onclick="newProject()"></button>
<button class="hot pause" aria-label="一時停止・再開" onclick="togglePause()"></button>
<button class="hot settings" aria-label="設定" onclick="showToast('設定：95点ゲート／手動承認／外部投稿OFF')"></button>
</main></div>
<script>
const roles=[
 ['調査AI','市場データ・根拠を収集'],['企画AI','競争戦略を反映して企画'],['台本AI','視聴者向けに文章化'],['チェックAI','事実・表現・品質を確認'],['編集AI','動画構成・編集を仕上げ']
];
let paused=false,cycle=0,timer=null,logs=[];
const state=JSON.parse(localStorage.getItem('aiworkroom_state')||'null')||{score:70,progress:[0,0,0,0,0],instruction:'節約・家計ショート動画'};
function renderAgents(){
 const el=document.getElementById('agents'); el.innerHTML='';
 roles.forEach((r,i)=>{const d=document.createElement('div');d.className='panel agent';d.innerHTML='<b>'+r[0]+' <span class="score" id="s'+i+'">'+state.progress[i]+'%</span></b><small>'+r[1]+'</small><div class="bar"><i id="b'+i+'"></i></div>';el.appendChild(d)});
 roles.forEach((_,i)=>{document.getElementById('b'+i).style.width=state.progress[i]+'%';});
}
function log(msg){logs.unshift(new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'　'+msg);logs=logs.slice(0,7);document.getElementById('log').innerHTML=logs.map(x=>'<div>'+x+'</div>').join('');}
function render(){renderAgents();const avg=Math.round(state.progress.reduce((a,b)=>a+b,0)/5);document.getElementById('overall').textContent='全体 '+avg+'%';document.getElementById('quality').textContent='品質 '+state.score+'点';document.getElementById('gateScore').textContent=state.score+'点';localStorage.setItem('aiworkroom_state',JSON.stringify(state));}
function tick(){
 if(paused)return; cycle++;
 const active=Math.min(4,Math.floor(cycle/12));
 state.progress=state.progress.map((v,i)=>i<active?v+Math.min(4,100-v):i===active?Math.min(100,v+3):v);
 if(cycle>58)state.score=Math.min(95,state.score+1);
 if(cycle%5===0)log(roles[Math.min(active,4)][0]+'：工程を改善中');
 if(state.score>=95){document.getElementById('managerTask').textContent='95点ゲート通過。次工程へ引き渡し準備完了';log('統括AI：95点ゲートを通過');clearInterval(timer);}
 render();
}
function start(){if(timer)clearInterval(timer);timer=setInterval(tick,700);log('統括AI：全工程を開始');render();}
function togglePause(){paused=!paused;document.getElementById('status').textContent=paused?'● PAUSED　作業を一時停止中':'● LIVE　統括AIが全工程を管理';log(paused?'統括AI：一時停止':'統括AI：作業を再開');}
function newProject(){state.progress=[0,0,0,0,0];state.score=70;cycle=0;logs=[];log('統括AI：新規プロジェクトを開始');start();}
function send(){const x=document.getElementById('instruction');if(!x.value.trim())return;state.instruction=x.value.trim();document.getElementById('managerTask').textContent='指示を受領：「'+state.instruction+'」';log('統括AI：ユーザー指示を受領');x.value='';start();render();}
function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
document.getElementById('instruction').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
render();start();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
