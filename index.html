<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>AI作業室｜アバター作業フロア</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#202633;--muted:#748096;--line:#e5e8ef;--accent:#6d5dfc;--ok:#18a957;--work:#4d7cff;--improve:#e3a21a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 16px}.brand{display:flex;align-items:center;gap:11px}.logo{width:45px;height:45px;border-radius:14px;background:#7567ff;display:grid;place-items:center;font-size:23px;box-shadow:0 5px 15px #6d5dfc33}.title{font-size:19px;font-weight:850}.sub{font-size:11px;color:var(--muted);margin-top:2px}
main{max-width:1450px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.75fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;box-shadow:0 5px 20px #18213b08}
.command{padding:14px}.command-title{font-weight:850;margin-bottom:8px}.command textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:13px;padding:11px;font-size:15px;resize:vertical;outline:none}.command textarea:focus{border-color:#a69fff;box-shadow:0 0 0 3px #6d5dfc12}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eeecff;color:#5146b8}.danger{background:#fff0f0;color:#b91c1c}
.manager{margin-top:13px;padding:13px;display:flex;gap:13px;align-items:center;background:linear-gradient(135deg,#fff,#f8f7ff)}.manager-avatar{width:68px;height:68px;border-radius:20px;background:#ece9ff;display:grid;place-items:center;font-size:38px;flex:none;border:3px solid #fff;box-shadow:0 4px 15px #3d327522;position:relative}.manager-avatar:after{content:"";position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;background:#18a957;border:3px solid #fff}.manager h2{font-size:16px;margin:0}.manager p{font-size:12px;color:var(--muted);margin:4px 0}.quality{font-size:12px;color:var(--muted)}
.floor{margin-top:13px;padding:13px}.floor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.floor-head b{font-size:15px}.floor-head span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.agent{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:linear-gradient(#fff 0 73%,#f7f8fc 73%);min-height:195px;padding:11px;transition:.25s}.agent.active{border-color:#9db5ff;box-shadow:0 0 0 2px #4d7cff18,0 9px 24px #4d7cff12}.agent.improving{border-color:#efca79;box-shadow:0 0 0 2px #e3a21a18}.agent.done{border-color:#a9dfbf}
.agent-top{display:flex;align-items:flex-start;justify-content:space-between}.name h3{font-size:13px;margin:0}.role{font-size:10px;color:var(--muted);margin-top:2px}.score{font-size:11px;font-weight:900}.scene{height:92px;position:relative;margin-top:4px}.avatar-wrap{position:absolute;left:12px;bottom:17px;width:60px;text-align:center;z-index:2}.face{width:47px;height:47px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#f3ecdf;border:3px solid #fff;box-shadow:0 4px 10px #18213b1a;font-size:27px;transform-origin:50% 90%}.body{width:54px;height:25px;margin:-1px auto 0;border-radius:18px 18px 8px 8px;background:#dfe4ff;border:2px solid #fff}.desk{position:absolute;left:4px;right:4px;bottom:4px;height:31px;border-radius:9px 9px 5px 5px;background:#d9dde8;border:1px solid #c8cedc}.desk:before{content:"";position:absolute;left:63px;top:-18px;width:36px;height:22px;border:4px solid #aeb6c8;border-bottom-width:7px;border-radius:5px;background:#edf0f7}.desk:after{content:"";position:absolute;left:76px;top:5px;width:12px;height:5px;border-radius:4px;background:#8e98ae}.paper{position:absolute;right:23px;bottom:13px;width:28px;height:19px;background:#fff;border:1px solid #d6dbe5;transform:rotate(-7deg)}.coffee{position:absolute;right:8px;bottom:12px;width:11px;height:10px;border-radius:3px;background:#c8946b}.activity{position:absolute;left:82px;right:4px;top:8px;background:#fff;border:1px solid #e5e8ef;border-radius:10px;padding:7px 8px;font-size:10px;line-height:1.35;color:#4e596d;box-shadow:0 4px 10px #18213b08}.activity:after{content:"";position:absolute;left:-6px;top:13px;border-width:5px 6px 5px 0;border-style:solid;border-color:transparent #e5e8ef transparent transparent}.working .face{animation:breathe 1.2s ease-in-out infinite}.working .desk:before{animation:screen 1s ease-in-out infinite}.improving .face{animation:think 1.8s ease-in-out infinite}.statusline{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:850;margin-top:3px}.dot{width:7px;height:7px;border-radius:50%;background:#c4c9d3}.working .dot{background:var(--work);box-shadow:0 0 0 4px #4d7cff16;animation:pulse 1s infinite}.improving .dot{background:var(--improve);box-shadow:0 0 0 4px #e3a21a16}.done .dot{background:var(--ok)}.task{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.bar{height:5px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:6px}.fill{height:100%;width:0;background:var(--accent);transition:width .4s}.done .fill{background:var(--ok)}
.side{display:flex;flex-direction:column;gap:13px}.side .panel{padding:14px}.metric{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric div{background:#f8fafc;border-radius:12px;padding:10px}.metric b{font-size:20px;display:block}.metric span{font-size:10px;color:var(--muted)}.log{max-height:440px;overflow:auto}.logitem{padding:8px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.4}.logitem b{display:block;color:var(--muted);font-size:10px;margin-bottom:2px}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1deg)}}@keyframes pulse{50%{opacity:.45}}@keyframes screen{50%{filter:brightness(1.2)}}@keyframes think{50%{transform:translateY(-2px) rotate(2deg)}}
@media(max-width:900px){main{grid-template-columns:1fr}.side{order:-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:9px}.grid{grid-template-columns:1fr}.agent{min-height:188px}.side{gap:9px}.floor{padding:10px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">🤖</div><div><div class="title">AI作業室</div><div class="sub">統括AI + 10専門AI｜アバター作業フロア｜95点品質ゲート</div></div></div></header>
<main>
<section>
<div class="panel command"><div class="command-title">👑 統括AIへの指示</div><textarea id="command" placeholder="例：10月の節約をテーマに、記事とショート動画を作る"></textarea><div class="actions"><button class="btn primary" onclick="startProject()">▶ プロジェクト開始</button><button class="btn secondary" onclick="demo()">デモ案件</button><button class="btn danger" onclick="resetRoom()">リセット</button></div></div>
<div class="panel manager"><div class="manager-avatar">🧑‍💼</div><div><h2>統括AI｜マネージャー</h2><p id="directorText">待機中。あなたからの指示を待っています。</p><div class="quality" id="overall">全体品質：—</div></div></div>
<div class="panel floor"><div class="floor-head"><b>🏢 AIエージェント作業フロア</b><span>アバターが各デスクで担当作業を実行</span></div><div class="grid" id="agents"></div></div>
</section>
<aside class="side">
<div class="panel"><b>📊 プロジェクト状況</b><div class="metric" style="margin-top:9px"><div><b id="progress">0%</b><span>全体進捗</span></div><div><b id="rounds">0</b><span>改善ラウンド</span></div><div><b id="passed">0/10</b><span>95点合格</span></div><div><b id="active">0</b><span>作業中</span></div></div></div>
<div class="panel"><b>🔁 品質ゲート</b><div class="quality" style="margin-top:7px">各部門は <b>95点以上</b> になるまで改善→再評価。市場調査・競争戦略は企画へフィードバックします。</div></div>
<div class="panel"><b>📝 作業ログ</b><div class="log" id="log" style="margin-top:7px"></div></div>
</aside>
</main>
<script>
const agents=[
['market','📊','市場調査AI','市場・顧客・競合'],['strategy','🏆','競争戦略AI','差別化・競争分析'],['planner','🧠','企画AI','企画・構成'],['research','🔎','情報収集AI','情報・資料'],['budget','💰','予算AI','予算・収益'],['writer','✍️','文章化AI','記事・台本'],['evidence','🔬','エビデンスAI','根拠・事実確認'],['video','🎬','動画制作AI','動画構成・制作'],['editor','✂️','編集AI','編集・仕上げ'],['builder','🛠️','実装AI','コード・システム']
];
let state={running:false,rounds:0,agents:{}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function init(){const el=document.getElementById('agents');el.innerHTML='';agents.forEach(([id,icon,name,role])=>{state.agents[id]={score:0,status:'待機',task:'待機中'};el.insertAdjacentHTML('beforeend',`<article class="agent" id="a-${id}"><div class="agent-top"><div class="name"><h3>${name}</h3><div class="role">${role}</div></div><div class="score" id="s-${id}">—</div></div><div class="scene"><div class="avatar-wrap"><div class="face">${icon}</div><div class="body"></div></div><div class="activity" id="ac-${id}">待機中。デスクで出番を待っています。</div><div class="desk"></div><div class="paper"></div><div class="coffee"></div></div><div class="statusline"><i class="dot"></i><span id="st-${id}">待機</span></div><div class="task" id="t-${id}">待機中</div><div class="bar"><div class="fill" id="f-${id}"></div></div></article>`)});log('AI作業室を起動。10人の専門AIが各デスクで待機しています。')}
function log(msg){document.getElementById('log').insertAdjacentHTML('afterbegin',`<div class="logitem"><b>${new Date().toLocaleTimeString('ja-JP')}</b>${msg}</div>`)}
function setAgent(id,status,task,score){const a=state.agents[id];a.status=status;a.task=task;if(score!==undefined)a.score=score;const card=document.getElementById('a-'+id);card.className='agent '+(status==='作業中'?'active working ':'')+(status==='改善中'?'improving ':'')+(status==='合格'?'done':'');document.getElementById('t-'+id).textContent=task;document.getElementById('ac-'+id).textContent=status==='作業中'?'作業中：'+task:status==='改善中'?'改善中：指摘を修正し再評価しています':status==='合格'?'完了：次工程へ引き継ぎ済み':'待機中。デスクで出番を待っています。';document.getElementById('st-'+id).textContent=status;document.getElementById('s-'+id).textContent=a.score?`${a.score}点`:'—';document.getElementById('f-'+id).style.width=(a.score||0)+'%';updateStats()}
function updateStats(){const vals=Object.values(state.agents),passed=vals.filter(a=>a.status==='合格').length,avg=Math.round(vals.reduce((s,a)=>s+a.score,0)/10);document.getElementById('passed').textContent=passed+'/10';document.getElementById('rounds').textContent=state.rounds;document.getElementById('active').textContent=vals.filter(a=>a.status==='作業中'||a.status==='改善中').length;document.getElementById('progress').textContent=Math.round(vals.reduce((s,a)=>s+Math.min(a.score,95),0)/950*100)+'%';document.getElementById('overall').textContent='全体品質：'+(passed===10?'95点以上・完成ゲート通過':(avg||0)+'点（進行中）')}
async function runAgent(id,task){setAgent(id,'作業中',task,Math.max(70,Math.floor(80+Math.random()*10)));await sleep(650);let score=0,round=0;while(score<95){round++;state.rounds++;score=Math.min(100,Math.floor(82+Math.random()*14+round*5));setAgent(id,round===1?'作業中':'改善中',round===1?task:`改善 ${round-1}：指摘事項を修正し再評価中`,score);log(`${agents.find(x=>x[0]===id)[2]}：${score}点。${score>=95?'品質ゲート合格。':'95点未満→改善作業へ。'}`);await sleep(550)}setAgent(id,'合格','品質ゲート通過・次工程へ',score)}
async function startProject(){if(state.running)return;const cmd=document.getElementById('command').value.trim();if(!cmd){document.getElementById('command').focus();return}state.running=true;state.rounds=0;document.getElementById('directorText').textContent='案件を分解し、各デスクへ指示を配布しています。';log('統括AI：案件を受領「'+cmd+'」');const seq=[['market','市場・顧客・競合・需要を調査'],['strategy','市場調査を分析し差別化案を作成'],['planner','市場分析を反映して企画を作成'],['research','企画に必要な情報・一次情報を収集'],['budget','必要コスト・収益モデル・無料代替策を算定'],['writer','企画と調査をもとに文章・台本を作成'],['evidence','文章・数字・根拠・出典を検証'],['video','台本を動画構成・素材・ナレーションへ変換'],['editor','動画・文章・デザインを最終品質へ編集'],['builder','必要なシステム・API・保存・テストを実装']];for(const x of seq)await runAgent(x[0],x[1]);setAgent('planner','作業中','市場調査・競争戦略を反映して最終企画を再確認',96);await sleep(700);setAgent('planner','合格','最終企画を確定',97);log('統括AI：全担当が95点以上。完成判定を実施します。');document.getElementById('directorText').textContent='完成。全担当が品質ゲートを通過しました。';state.running=false;updateStats()}
function demo(){document.getElementById('command').value='10月の節約をテーマに、note記事とショート動画を制作する';startProject()}
function resetRoom(){if(state.running)return;init();document.getElementById('directorText').textContent='待機中。あなたからの指示を待っています。'}
init();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
