<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>AI作業室</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f3e7da;color:#4c4039;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{min-height:100vh}.shell{min-height:100vh;display:flex;justify-content:center;padding:10px}
.artboard{position:relative;width:min(1350px,100vw);aspect-ratio:3/2;overflow:hidden;border-radius:18px;box-shadow:0 10px 32px rgba(83,53,33,.18);background:#fff}
.reference{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}.panel,.control,.status{opacity:1}
button,input{font:inherit}.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:12px}
.new{left:61%;top:3%;width:9%;height:6.5%}.pause{left:70%;top:3%;width:8%;height:6.5%}.settings{left:78.5%;top:3%;width:9%;height:6.5%}
.dynamic-agents{position:absolute;inset:0;pointer-events:none;z-index:30;display:block}.dyn-card{position:absolute;width:15.5%;min-height:6.8%;padding:5px 7px;background:rgba(255,255,255,.94);border:2px solid #d5b49a;border-radius:14px;box-shadow:0 4px 14px rgba(70,45,30,.14);font-size:9px;transition:transform .5s}.dyn-card.active{transform:translateY(-3px)}.dyn-card b{display:block;font-size:10px}.dyn-card small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}.dyn-card .mini-bar{height:4px;background:#eadfd5;border-radius:5px;overflow:hidden}.dyn-card .mini-bar i{display:block;height:100%;background:#8b6a57;transition:width .4s}.thought{position:absolute;left:45%;top:48%;display:none;z-index:7;padding:7px 11px;background:#fff;border:2px solid #d8c1ae;border-radius:18px;font-weight:800;font-size:11px;box-shadow:0 5px 18px rgba(0,0,0,.14)}.handoff-layer{position:absolute;inset:0;pointer-events:none;z-index:6}.doc{position:absolute;width:24px;height:18px;border-radius:4px;background:#fff;border:2px solid #8b6a57;box-shadow:0 2px 6px rgba(0,0,0,.18);transform:translate(-50%,-50%);font-size:9px;text-align:center;line-height:14px;transition:left 1.2s ease-in-out,top 1.2s ease-in-out}.panel{position:absolute;background:rgba(255,255,255,.95);border:2px solid rgba(205,169,139,.8);box-shadow:0 5px 16px rgba(80,55,40,.12);border-radius:16px;backdrop-filter:blur(3px)}
.project{left:29%;top:10.8%;width:40%;padding:9px 14px}.project strong{font-size:14px}.project span{float:right;font-size:12px;color:#7b6a60}
.agents{position:absolute;left:3%;right:23%;top:37%;height:9%;display:grid;grid-template-columns:repeat(5,1fr);gap:1%;z-index:40}.agent{background:rgba(255,255,255,.97);border:2px solid #d5b49a;border-radius:14px;box-shadow:0 4px 14px rgba(70,45,30,.14);min-height:58px;overflow:hidden}
.agent{min-width:0;padding:7px 9px}.agent b{font-size:12px}.agent small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 5px;color:#75645b}.bar{height:6px;background:#eadfd5;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .35s}.score{float:right;font-size:11px;font-weight:800}
.manager{left:5.5%;bottom:6.5%;width:24%;padding:8px 11px}.manager b{font-size:13px}.manager small{display:block;color:#78675e;margin-top:2px}.manager .quality{float:right;font-weight:900;color:#d28d35}
.log{position:absolute;right:1.2%;top:12.8%;width:14%;height:49%;padding:7px;overflow:hidden}.log h3{font-size:13px;margin:0 0 5px}.log div{font-size:9px;line-height:1.45;padding:3px 0;border-bottom:1px dashed #e7d8cb}.gate{position:absolute;right:1.2%;bottom:20.5%;width:14%;padding:7px;text-align:center}.gate b{font-size:11px}.gate strong{display:block;font-size:20px;color:#d18d39}.toast{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:none;z-index:5;min-width:220px;max-width:70%;padding:12px 15px;background:#fff;border:2px solid #d4b196;border-radius:16px;box-shadow:0 12px 35px rgba(0,0,0,.16);text-align:center;font-size:13px}
.control{position:absolute;left:32%;bottom:1.7%;width:36%;display:flex;gap:6px}.control input{flex:1;border:1px solid #d9c6b7;border-radius:18px;padding:7px 10px;background:rgba(255,255,255,.95);outline:none;font-size:11px}.control button{border:0;border-radius:18px;padding:7px 12px;background:#8b6a57;color:white;font-weight:800;font-size:11px}
.status{position:absolute;left:1.7%;bottom:1.7%;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.95);font-size:10px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.dyn-card{font-size:5px;padding:2px 3px;border-width:1px;border-radius:7px}.dyn-card b{font-size:5.5px}.dyn-card small{margin:1px 0}.dyn-card .mini-bar{height:2px}.thought{font-size:6px;padding:3px 5px;border-width:1px}.doc{width:13px;height:10px;font-size:5px;line-height:7px;border-width:1px}
@media(max-width:700px){.shell{padding:0}.artboard{width:100vw;height:66.6667vw;aspect-ratio:3/2;border-radius:0;box-shadow:none}.project{font-size:8px;padding:4px 6px}.project strong{font-size:8px}.project span{font-size:7px}.agents{top:37%;left:4%;right:16%;gap:1%}.agents{left:3%;right:23%;top:37%;height:9%;gap:.8%;z-index:40}.agent{height:100%;min-height:46px;padding:4px 5px;border-width:1px;border-radius:9px}.agent b{font-size:6.8px}.agent small{font-size:5.5px;line-height:1.25}.agent .bar{height:3px}.agent{padding:3px 4px;border-radius:8px}.agent b{font-size:6.5px}.agent small{font-size:5.5px;margin:1px 0 2px}.bar{height:3px}.score{font-size:5.5px}.manager{font-size:6px;padding:4px 6px}.manager b{font-size:7px}.manager small{font-size:5px}.log{padding:5px;overflow:hidden}.log h3{font-size:7px;margin:0 0 3px}.log div{font-size:4.7px;line-height:1.5;padding:2px 0;white-space:normal;overflow-wrap:anywhere}.gate{padding:3px}.gate b{font-size:5.5px}.gate strong{font-size:10px}.control{left:31%;width:37%;bottom:1.2%}.control input{font-size:6px;padding:4px 6px}.control button{font-size:6px;padding:4px 7px}.status{font-size:5.5px;padding:3px 5px}}
</style>
</head>
<body>
<div class="shell"><main class="artboard" id="board">
<img class="reference" src="./visual-reference.svg" alt="AI作業室">
<div class="panel project"><strong>現在のプロジェクト：節約・家計ショート動画</strong><span id="overall">全体 45%</span></div>
<div class="agents" id="agents">
<div class="panel agent" data-i="0"><b>調査AI <span class="score">70%</span></b><small>作業中… 市場データ・根拠を収集</small><div class="bar"><i></i></div></div>
<div class="panel agent" data-i="1"><b>企画AI <span class="score">45%</span></b><small>考え中… 競争戦略を反映</small><div class="bar"><i></i></div></div>
<div class="panel agent" data-i="2"><b>台本AI <span class="score">60%</span></b><small>作業中… 視聴者向けに文章化</small><div class="bar"><i></i></div></div>
<div class="panel agent" data-i="3"><b>チェックAI <span class="score">30%</span></b><small>待機中… 受け渡し待ち</small><div class="bar"><i></i></div></div>
<div class="panel agent" data-i="4"><b>編集AI <span class="score">20%</span></b><small>作業中… 動画構成・編集</small><div class="bar"><i></i></div></div>
</div>
<div class="panel manager"><b>統括AI</b><span class="quality" id="quality">品質 82点</span><small id="managerTask">市場調査と競争戦略を確認中</small></div>
<div class="panel log"><h3>作業ログ</h3><div id="log"><div>10:27　調査AI：市場データを確認中</div><div>10:27　企画AI：企画案を検討中</div><div>10:27　台本AI：台本を作成中</div><div>10:27　チェックAI：受け渡し待ち</div><div>10:27　編集AI：編集作業中</div></div></div>
<div class="panel gate"><b>品質ゲート</b><strong id="gateScore">82点</strong></div>
<div class="control"><input id="instruction" placeholder="統括AIへの指示（例：節約動画を作る）"><button onclick="send()">送信</button></div>
<div class="status" id="status">● LIVE　統括AIが全工程を管理</div>
<div class="toast" id="toast"></div>
<button class="hot new" aria-label="新規プロジェクト" onclick="newProject()"></button>
<button class="hot pause" aria-label="一時停止・再開" onclick="togglePause()"></button>
<button class="hot settings" aria-label="設定" onclick="showToast('設定：95点ゲート／手動承認／外部投稿OFF')"></button>

<div class="handoff-layer" id="handoffLayer"></div>
<div class="thought" id="thought"></div>
</main></div>
<script>
const API_URL='https://ai-workroom-api.onrender.com';
const roles=[
 ['調査AI','市場データ・根拠を収集'],['企画AI','競争戦略を反映して企画'],['台本AI','視聴者向けに文章化'],['チェックAI','事実・表現・品質を確認'],['編集AI','動画構成・編集を仕上げ']
];
const positions=[
 {x:9,y:31},{x:28,y:31},{x:45,y:37},{x:64,y:31},{x:79,y:37}
];
let paused=false,timer=null,logs=[];
const state=JSON.parse(localStorage.getItem('aiworkroom_state')||'null')||{
 score:82,quality:[82,82,82,82,82],progress:[70,45,60,30,20],
 phases:['working','thinking','working','waiting','working'],
 delivered:[false,false,false,false,false],
 instruction:'節約・家計ショート動画'
};
const phaseText={working:'作業中…',thinking:'考え中…',waiting:'待機中…',done:'完了'};
const phaseLog={working:'工程を進行中',thinking:'考え中…',waiting:'次の受け渡しを待機中',done:'工程完了'};
function renderAgents(){
 document.querySelectorAll('#agents .agent').forEach((d,i)=>{
   if(!roles[i]) return;
   d.className='panel agent '+(state.phases[i]==='working'?'active':'');
   d.querySelector('.score').textContent=state.progress[i]+'%';
   d.querySelector('small').textContent=phaseText[state.phases[i]]+' '+roles[i][1];
   d.querySelector('.bar i').style.width=state.progress[i]+'%';
 });
}
function log(msg){logs.unshift(new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'　'+msg);logs=logs.slice(0,9);document.getElementById('log').innerHTML=logs.map(x=>'<div>'+x+'</div>').join('');}
function render(){
 renderAgents();
 const avg=Math.round(state.progress.reduce((a,b)=>a+b,0)/5);
 document.getElementById('overall').textContent='全体 '+avg+'%';
 document.getElementById('quality').textContent='品質 '+state.score+'点';
 document.getElementById('gateScore').textContent=state.score+'点';
 localStorage.setItem('aiworkroom_state',JSON.stringify(state));
}
function moveDocument(from,to,label){
 const layer=document.getElementById('handoffLayer'),d=document.createElement('div');d.className='doc';d.textContent='📄';d.style.left=positions[from].x+'%';d.style.top=positions[from].y+'%';layer.appendChild(d);
 requestAnimationFrame(()=>{d.style.left=positions[to].x+'%';d.style.top=positions[to].y+'%';});
 setTimeout(()=>d.remove(),1400);
 log(roles[from][0]+' → '+roles[to][0]+'：'+label);
}
function tick(){
 if(paused)return;
 roles.forEach((r,i)=>{
   if(state.phases[i]==='waiting'){
     if(i===0 || state.delivered[i-1]) state.phases[i]='working';
   } else if(state.phases[i]==='thinking'){
     if(Math.random()<.38) state.phases[i]='working';
   } else if(state.phases[i]==='working'){
     state.progress[i]=Math.min(100,state.progress[i]+(i===0?2:1+Math.floor(Math.random()*3)));
     if(Math.random()<.13) state.phases[i]='thinking';
     if(state.progress[i]>=100){
       if((state.quality?.[i]??state.score)<95){state.progress[i]=80;state.phases[i]='thinking';log(roles[i][0]+'：品質ゲート未達。改善ラウンドを開始');}
       else {state.phases[i]='done';if(i<4){state.delivered[i]=true;moveDocument(i,i+1,'資料を持って席を立ち、引き渡し');state.phases[i+1]='waiting';}else log('編集AI：最終成果物を統括AIへ返却');}
     }
   }
 });
 if(Math.random()<.18) log(roles[Math.floor(Math.random()*5)][0]+'：'+phaseLog[state.phases[Math.floor(Math.random()*5)]]);
 if(!state.quality)state.quality=[82,82,82,82,82];
 if(Math.random()<.12){const q=Math.floor(Math.random()*5);if(state.quality[q]<95)state.quality[q]++;}
 state.score=Math.round(state.quality.reduce((a,b)=>a+b,0)/state.quality.length);
 if(state.score>=95 && Math.random()<.03) log('統括AI：品質95点以上を確認。次工程へ進行');
 render();
}
function start(){if(timer)clearInterval(timer);timer=setInterval(tick,900);if(!logs.length){log('統括AI：5人を非同期で稼働開始');log('調査AI → 企画AI：調査資料を準備中');log('台本AI：内容を作成中');}else{log('統括AI：5人を非同期で稼働中');}render();}
function togglePause(){paused=!paused;document.getElementById('status').textContent=paused?'● PAUSED　作業を一時停止中':'● LIVE　5人のAIが非同期で作業中';log(paused?'統括AI：一時停止':'統括AI：作業を再開');}
function newProject(){state.progress=[0,0,0,0,0];state.quality=[70,70,70,70,70];state.score=70;state.phases=['working','waiting','waiting','waiting','waiting'];state.delivered=[false,false,false,false,false];logs=[];log('統括AI：新規プロジェクト開始');start();}
async function send(){const x=document.getElementById('instruction');if(!x.value.trim())return;
 state.instruction=x.value.trim();document.getElementById('managerTask').textContent='指示を受領：「'+state.instruction+'」';
 log('統括AI：ユーザー指示を受領 → 各担当へ分担');
 roles.forEach((r,i)=>{if(state.phases[i]==='done')state.progress[i]=Math.min(state.progress[i],95); if(i===0)state.phases[i]='working'; else if(state.phases[i]!=='working')state.phases[i]=i===1?'thinking':'waiting';});
 log('市場調査AI・競争戦略AI：並列調査を開始');log('企画AI・情報収集AI・予算AI：受領待ち');log('文章化AI・動画制作AI・編集AI・実装AI：順次受領待ち');
 x.value='';start();render();
 try{
   const r=await fetch(API_URL+'/api/orchestrate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction:state.instruction,project:'AI作業室',max_output_tokens:700})});
   const data=await r.json();
   if(data.workflow){
     data.workflow.forEach(w=>log(w.stage+'工程：'+w.roles.join('・')+' が担当'));
   }
   if(data.mode==='openai'){
     log('統括AI：実AI処理が完了。各担当の成果を受領');
     data.results.forEach(item=>{
       if(item.status==='completed'){
         const summary=(item.text||'').replace(/\s+/g,' ').slice(0,70);
         log(item.role+'：成果を次工程へ引き渡し'+(summary?'「'+summary+'」':''));
       } else if(item.status==='error'){
         log(item.role+'：エラーを検知。改善待ち');
       }
     });
     const manager=data.results.find(item=>item.role==='統括AI');
     const roleMap={'市場調査AI':0,'企画AI':1,'文章化AI':2,'エビデンスAI':3,'編集AI':4};
     data.results.forEach(item=>{
       const i=roleMap[item.role];
       if(i===undefined)return;
       if(item.status==='completed'){
         state.progress[i]=100;
         state.phases[i]='done';
         state.delivered[i]=false;
         if(i<4){
           state.delivered[i]=true;
           state.phases[i+1]='waiting';
           moveDocument(i,i+1,'API成果を受領して引き渡し');
         }
       }
     });
     document.getElementById('managerTask').textContent=manager&&manager.text?'実AI処理完了：'+manager.text.replace(/\s+/g,' ').slice(0,90):'実AI処理完了：成果を確認・統合中';
     if(data.gate&&data.gate.passed){
       state.score=95;
       log('統括AI：品質ゲート95点条件を確認');
     }else{
       state.score=Math.min(state.score,94);
       log('統括AI：品質ゲート95点は未達。改善工程を継続');
     }
     render();
   }else{
     log('AI API：未設定。料金の発生しない安全なシミュレーションを継続');
     document.getElementById('managerTask').textContent='シミュレーション完了：API接続後に実AI品質判定へ';
     state.score=Math.min(94,Math.max(state.score,82));
     render();
   }
 }catch(e){log('AI API：接続待ち。画面シミュレーションを継続');}
}
function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
document.getElementById('instruction').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
render();start();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js?v=19').then(()=>navigator.serviceWorker.ready).then(()=>navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()))).catch(()=>{}); }</script>
</body></html>
