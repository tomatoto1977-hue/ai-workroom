<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>AI作業室</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#1f2937;--muted:#718096;--line:#e5e7eb;--accent:#6d5dfc;--green:#16a34a;--yellow:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:#7567ff;display:grid;place-items:center;color:#fff;font-size:23px}.title{font-size:20px;font-weight:800}.sub{font-size:12px;color:var(--muted)}
main{max-width:1400px;margin:auto;padding:16px;display:grid;grid-template-columns:1.6fr .9fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(15,23,42,.04)}
.command{padding:16px}.command textarea{width:100%;min-height:78px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;resize:vertical}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#eef0ff;color:#5146b8}.danger{background:#fff0f0;color:#b91c1c}
.director{padding:16px;display:flex;gap:14px;align-items:center;margin-top:16px}.avatar{width:54px;height:54px;border-radius:50%;background:#f0edff;display:grid;place-items:center;font-size:27px;flex:none;border:3px solid #fff;box-shadow:0 2px 9px rgba(0,0,0,.08)}.avatar.big{width:68px;height:68px;font-size:36px}.director h2{margin:0;font-size:17px}.director p{margin:4px 0;color:var(--muted);font-size:13px}
.grid{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.agent{border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;gap:11px}.agent.active{border-color:#b8b0ff;box-shadow:0 0 0 2px #eeeaff}.agent.done{border-color:#b7e4c7}.agent h3{margin:0;font-size:14px}.role{font-size:11px;color:var(--muted)}.task{font-size:12px;margin:8px 0;min-height:30px}.status{font-size:11px;font-weight:700}.score{font-size:12px;font-weight:800;margin-left:auto}.bar{height:6px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--accent);width:0;transition:width .5s}.done .fill{background:var(--green)}
.side{display:flex;flex-direction:column;gap:16px}.side .panel{padding:16px}.metric{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric div{padding:12px;border-radius:12px;background:#f8fafc}.metric b{font-size:22px;display:block}.metric span{font-size:11px;color:var(--muted)}.log{max-height:470px;overflow:auto}.logitem{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.logitem b{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.quality{font-size:12px;color:var(--muted)}
@media(max-width:900px){main{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.side{order:-1}}@media(max-width:480px){main{padding:10px}.grid{padding:10px}.command,.director,.side .panel{padding:12px}.title{font-size:18px}}
</style></head>
<body>
<header><div class="brand"><div class="logo">🤖</div><div><div class="title">AI作業室</div><div class="sub">10人の専門AI + 統括AI / 95点品質ゲート</div></div></div></header>
<main><section>
<div class="panel command"><div style="font-weight:800;margin-bottom:8px">👑 統括AIへの指示</div><textarea id="command" placeholder="例：10月の節約をテーマに、記事とショート動画を作る"></textarea><div class="actions"><button class="btn primary" onclick="startProject()">▶ プロジェクト開始</button><button class="btn secondary" onclick="demo()">デモ案件</button><button class="btn danger" onclick="resetRoom()">リセット</button></div></div>
<div class="panel director"><div class="avatar big">🧑‍💼</div><div><h2>統括AI</h2><p id="directorText">待機中。あなたからの指示を待っています。</p><div class="quality" id="overall">全体品質：—</div></div></div>
<div class="panel" style="margin-top:16px"><div style="padding:16px 16px 0;font-weight:800">🏢 エージェント作業フロア</div><div class="grid" id="agents"></div></div>
</section>
<aside class="side">
<div class="panel"><div style="font-weight:800;margin-bottom:10px">📊 プロジェクト状況</div><div class="metric"><div><b id="progress">0%</b><span>全体進捗</span></div><div><b id="rounds">0</b><span>改善ラウンド</span></div><div><b id="passed">0/10</b><span>95点合格</span></div><div><b id="active">0</b><span>作業中</span></div></div></div>
<div class="panel"><div style="font-weight:800;margin-bottom:10px">🔁 品質ゲート</div><div class="quality">各部門は <b>95点以上</b> になるまで改善→再評価を繰り返します。市場調査と競争戦略は企画修正へフィードバックします。</div></div>
<div class="panel"><div style="font-weight:800;margin-bottom:8px">📝 作業ログ</div><div class="log" id="log"></div></div>
</aside></main>
<script>
const agents=[['planner','🧠','企画AI','企画・構成'],['research','🔎','情報収集AI','情報・資料'],['budget','💰','予算AI','予算・収益'],['writer','✍️','文章化AI','記事・台本'],['evidence','🔬','エビデンスAI','根拠・事実確認'],['video','🎬','動画制作AI','動画構成・制作'],['editor','✂️','編集AI','編集・仕上げ'],['builder','🛠️','実装AI','コード・システム'],['market','📊','市場調査AI','市場・顧客・競合'],['strategy','🏆','競争戦略AI','差別化・企画修正']];
let state={running:false,rounds:0,agents:{}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function init(){const el=document.getElementById('agents');el.innerHTML='';agents.forEach(([id,icon,name,role])=>{state.agents[id]={score:0,status:'待機',task:'待機中'};el.insertAdjacentHTML('beforeend',`<div class="agent" id="a-${id}"><div class="avatar">${icon}</div><div style="min-width:0;flex:1"><div style="display:flex;gap:6px"><div><h3>${name}</h3><div class="role">${role}</div></div><div class="score" id="s-${id}">—</div></div><div class="task" id="t-${id}">待機中</div><div class="status" id="st-${id}">⚪ 待機</div><div class="bar"><div class="fill" id="f-${id}"></div></div></div></div>`)});log('AI作業室を起動しました。10人の専門AIが待機しています。')}
function log(msg){document.getElementById('log').insertAdjacentHTML('afterbegin',`<div class="logitem"><b>${new Date().toLocaleTimeString('ja-JP')}</b>${msg}</div>`)}
function setAgent(id,status,task,score){const a=state.agents[id];a.status=status;a.task=task;if(score!==undefined)a.score=score;document.getElementById('t-'+id).textContent=task;document.getElementById('st-'+id).textContent=status==='作業中'?'🔵 作業中':status==='改善中'?'🟡 改善中':status==='合格'?'🟢 合格':'⚪ '+status;document.getElementById('s-'+id).textContent=a.score?`${a.score}点`:'—';document.getElementById('f-'+id).style.width=(a.score||0)+'%';document.getElementById('a-'+id).className='agent '+(status==='作業中'?'active ':'')+(status==='合格'?'done':'');updateStats()}
function updateStats(){const vals=Object.values(state.agents),passed=vals.filter(a=>a.status==='合格').length,avg=Math.round(vals.reduce((s,a)=>s+a.score,0)/10);document.getElementById('passed').textContent=passed+'/10';document.getElementById('rounds').textContent=state.rounds;document.getElementById('active').textContent=vals.filter(a=>a.status==='作業中'||a.status==='改善中').length;document.getElementById('progress').textContent=Math.round(vals.reduce((s,a)=>s+Math.min(a.score,95),0)/950*100)+'%';document.getElementById('overall').textContent='全体品質：'+(passed===10?'95点以上・完成ゲート通過':(avg||0)+'点（進行中）')}
async function runAgent(id,task){setAgent(id,'作業中',task,Math.max(60,Math.floor(78+Math.random()*15)));await sleep(400);let score=0,round=0;while(score<95){round++;state.rounds++;score=Math.min(100,Math.floor(82+Math.random()*17+round*5));setAgent(id,round===1?'作業中':'改善中',round===1?task:`改善 ${round-1}: 指摘事項を修正し再評価中`,score);log(`${agents.find(x=>x[0]===id)[2]}：${score}点。${score>=95?'合格しました。':'95点未満のためブラッシュアップします。'}`);await sleep(320)}setAgent(id,'合格','品質ゲート通過・次工程へ',score)}
async function startProject(){if(state.running)return;const cmd=document.getElementById('command').value.trim();if(!cmd){document.getElementById('command').focus();return}state.running=true;state.rounds=0;document.getElementById('directorText').textContent='案件を分解し、各担当へ指示を配布しています。';log('統括AI：案件を受領。「'+cmd+'」');const seq=[['market','市場・顧客・競合・需要を調査'],['strategy','市場調査を分析し、差別化案を作成'],['planner','市場分析を反映して企画を作成'],['research','企画に必要な情報・一次情報を収集'],['budget','必要コスト・収益モデル・無料代替策を算定'],['writer','企画と調査をもとに文章・台本を作成'],['evidence','文章・数字・根拠・出典を検証'],['video','台本を動画構成・素材・ナレーションへ変換'],['editor','動画・文章・デザインを最終品質へ編集'],['builder','必要なシステム・API・保存・テストを実装']];for(const x of seq)await runAgent(x[0],x[1]);setAgent('planner','作業中','市場調査・競争戦略を反映して最終企画を再確認',96);await sleep(350);setAgent('planner','合格','最終企画を確定',97);log('統括AI：全担当が95点以上。完成判定を実施します。');document.getElementById('directorText').textContent='完成。全10部門の品質ゲートを通過しました。';state.running=false;updateStats()}
function demo(){document.getElementById('command').value='10月の節約をテーマに、note記事とショート動画を制作する';startProject()}
function resetRoom(){if(state.running)return;init();document.getElementById('directorText').textContent='待機中。あなたからの指示を待っています。'}
init();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
