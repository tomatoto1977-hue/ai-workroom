<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7ef"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>AI作業室</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#f6eadc;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}body{min-height:100vh;overflow-x:auto}.shell{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:12px}.artboard{position:relative;width:min(1350px,100vw);aspect-ratio:3/2;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 35px rgba(83,53,33,.18)}.reference{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:12px}.new{left:61.2%;top:3%;width:9.4%;height:6.5%}.pause{left:70.7%;top:3%;width:8.2%;height:6.5%}.settings{left:79%;top:3%;width:9%;height:6.5%}.spark{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff7d6;box-shadow:0 0 0 4px rgba(255,255,255,.55),0 0 18px #ffd66a;opacity:0;pointer-events:none}.s1{left:39.7%;top:33.5%}.s2{left:59.2%;top:35.5%}.s3{left:72.5%;top:47.5%}.spark.on{animation:fly 1.4s ease-in-out infinite}@keyframes fly{0%{opacity:0;transform:scale(.4) translate(0,0)}25%{opacity:1}70%{opacity:1}100%{opacity:0;transform:scale(1.2) translate(90px,-30px)}}.pulse{position:absolute;right:1.8%;top:12.1%;width:1.2%;aspect-ratio:1;background:#38caa0;border:3px solid white;border-radius:50%;box-shadow:0 0 0 0 rgba(56,202,160,.55);animation:pulse 1.7s infinite}@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(56,202,160,0)}}.progress-overlay{position:absolute;height:.9%;border-radius:99px;background:rgba(255,255,255,.45);overflow:hidden;pointer-events:none}.progress-overlay i{display:block;height:100%;width:0;border-radius:99px;transition:width .3s}.p1{left:4.2%;top:30.0%;width:14.8%}.p2{left:28.3%;top:27.2%;width:14.2%}.p3{left:47.1%;top:31.0%;width:14.7%}.p4{left:67.0%;top:29.4%;width:13.8%}.p5{left:67.0%;top:62.0%;width:13.8%}.status-pill{position:absolute;left:1.6%;bottom:1.5%;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.94);font-size:12px;font-weight:800;box-shadow:0 3px 12px rgba(0,0,0,.12);opacity:.96}.status-pill small{font-weight:500;color:#777;margin-left:5px}@media(max-width:700px){.shell{padding:0;justify-content:flex-start}.artboard{width:900px;min-width:900px;border-radius:0;box-shadow:none}.status-pill{font-size:11px}}@media(min-width:701px){.artboard{width:min(1350px,calc(100vw - 24px))}}
</style></head><body><div class="shell"><div class="artboard" id="board"><img class="reference" src="./visual-reference.svg" alt="AI作業室のビジュアル"><button class="hot new" aria-label="新規プロジェクト" onclick="start()"></button><button class="hot pause" aria-label="一時停止" onclick="togglePause()"></button><button class="hot settings" aria-label="表示設定" onclick="settings()"></button><div class="pulse"></div><div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="progress-overlay p1"><i id="q1"></i></div><div class="progress-overlay p2"><i id="q2"></i></div><div class="progress-overlay p3"><i id="q3"></i></div><div class="progress-overlay p4"><i id="q4"></i></div><div class="progress-overlay p5"><i id="q5"></i></div><div class="status-pill" id="live">AI作業室 LIVE <small>ビジュアル参照をそのまま使用中</small></div></div></div><script>let timer=null,paused=false,running=false;const ids=["q1","q2","q3","q4","q5"];const cols=["#4da8e5","#f2b32f","#ed6f92","#45c89b","#8f72df"];function paint(i,v){const e=document.getElementById(ids[i]);e.style.width=v+"%";e.style.background=cols[i]}function start(){if(running)return;running=true;paused=false;let t=0;document.querySelectorAll('.spark').forEach(x=>x.classList.add('on'));paint(0,5);paint(1,3);paint(2,2);paint(3,1);paint(4,1);timer=setInterval(()=>{if(paused)return;t+=1;const vals=[Math.min(70,t*1.7),Math.min(60,Math.max(3,(t-5)*1.5)),Math.min(60,Math.max(2,(t-10)*1.4)),Math.min(45,Math.max(1,(t-18)*1.3)),Math.min(30,Math.max(1,(t-26)*1.1))];vals.forEach((v,i)=>paint(i,v));if(t>=55){clearInterval(timer);running=false;document.getElementById('live').innerHTML='AI作業室 LIVE <small>工程サイクル完了・品質ゲート確認中</small>';}} ,180)}function togglePause(){paused=!paused;document.getElementById('live').innerHTML=paused?'AI作業室 PAUSED <small>上部の一時停止ボタンで再開</small>':'AI作業室 LIVE <small>作業を再開しました</small>'}function settings(){document.getElementById('live').innerHTML='AI作業室 <small>表示設定：参照ビジュアル固定</small>'}start();</script></body></html>
